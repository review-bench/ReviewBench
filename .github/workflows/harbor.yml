name: Harbor adapter

on:
  pull_request:
    paths:
      - "scripts/**"
      - "tests/**"
      - "corpus/**"
      - "golden/**"
      - "package*.json"
      - "tsconfig.json"
      - "pyproject.toml"
      - ".github/workflows/harbor.yml"
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "tests/**"
      - "corpus/**"
      - "golden/**"
      - "package*.json"
      - "tsconfig.json"
      - "pyproject.toml"
      - ".github/workflows/harbor.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - name: Install pinned Harbor schema/packager only
        run: |
          python -m pip install 'pydantic>=2,<3' toml pathspec
          python - <<'PY'
          import subprocess
          import sys
          import tomllib
          from pathlib import Path
          dependencies = tomllib.loads(Path("pyproject.toml").read_text())["project"]["dependencies"]
          harbor = next(dependency for dependency in dependencies if dependency.startswith("harbor @ "))
          subprocess.run([sys.executable, "-m", "pip", "install", "--no-deps", harbor], check=True)
          PY
      - run: python tests/harbor-format.test.py
      - name: Export and validate both datasets without network or inference
        shell: bash
        run: |
          set -euo pipefail
          # Schema-only fixture digest: no image is pulled or built by this job.
          image="node:22-bookworm-slim@sha256:$(printf 'a%.0s' {1..64})"
          for split in full test; do
            npm run harbor:export -- --output ".harbor/$split" --split "$split" \
              --judge-provider openai --judge-model schema-fixture --base-image "$image" \
              --agent-host api.openai.com --judge-host api.openai.com \
              --judge-env OPENAI_API_KEY=RB_HARBOR_JUDGE_KEY
            python scripts/harbor/check-format.py ".harbor/$split"
          done
  docker-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: ${{ github.workspace }}
      RB_HARBOR_JUDGE_TOKEN: reviewbench-isolation-sentinel
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: npm ci --no-audit --no-fund
      - name: Install pinned Harbor runtime
        run: |
          python -m pip install uv
          python -m pip install .
      - name: Check native run controls with synthetic trials and no inference
        run: |
          python tests/harbor-run.test.py
          python tests/harbor-hub.test.py
      - name: Check installed runtime outside the source checkout
        run: |
          python -m pip wheel --no-deps . --wheel-dir .harbor/wheels
          wheel="$PWD/.harbor/wheels/reviewbench_harbor-0.1.0rc10-py3-none-any.whl"
          tests="$PWD/tests"
          cd "$(mktemp -d)"
          unset PYTHONPATH
          python -m pip install --force-reinstall --no-deps "$wheel"
          python -c "from reviewbench_harbor.reviewbench_plugin import ReviewBenchPlugin; from pathlib import Path; import reviewbench_harbor; root = Path(reviewbench_harbor.__file__).parent; assert all((root / name).is_file() for name in ('metric.py', 'check-job.py'))"
          python -c "from importlib.metadata import distribution; from packaging.requirements import Requirement; from harbor.upload.metrics import UploadMetrics; dist = distribution('reviewbench-harbor'); assert all(str(path).startswith('reviewbench_harbor/') for path in dist.files if str(path).endswith('.py')); assert len(dist.requires) == 1; dependency = Requirement(dist.requires[0]); assert dependency.name == 'harbor' and dependency.url == 'git+https://github.com/MiichelleZhou/harbor.git@6ce6abee0b9fa94a50c88f0557d030a419998d78'"
          reviewbench-check-job --help
          reviewbench-check-dataset --help
          reviewbench-sync-hub-metrics --help
          REVIEWBENCH_TEST_INSTALLED=1 python "$tests/harbor-run.test.py"
          REVIEWBENCH_TEST_INSTALLED=1 python "$tests/harbor-hub.test.py"
      - name: Run no-inference isolation and artifact-transfer trial
        shell: bash
        run: |
          set -euo pipefail
          npm run harbor:export -- --output .harbor/smoke --split test --limit 1 \
            --judge-provider github-copilot --judge-model isolation-fixture \
            --base-image node:22-bookworm-slim@sha256:efd0ab5780c2d9ab1f0f869571a00d5edb17793bff4cce4a2792e3eb0ffc7562 \
            --agent-host api.githubcopilot.com --judge-host api.githubcopilot.com \
            --judge-env COPILOT_GITHUB_TOKEN=RB_HARBOR_JUDGE_TOKEN
          python - <<'PY'
          from pathlib import Path
          script = next(Path(".harbor/smoke").glob("*/tests/test.sh"))
          script.write_text(script.read_text().replace(
              "set -euo pipefail\n",
              'set -euo pipefail\ntest "${COPILOT_GITHUB_TOKEN:-}" = "reviewbench-isolation-sentinel"\n',
          ), encoding="utf-8")
          PY
          harbor run -p .harbor/smoke -a scripts.harbor.smoke_agent:EmptyReviewAgent \
            -e docker -k 1 -n 1 --job-name empty-smoke --jobs-dir .harbor/jobs --yes
          python scripts/harbor/check-job.py .harbor/jobs/empty-smoke \
            .harbor/smoke/metric.py --output .harbor/smoke-metrics.json
          python - <<'PY'
          import json
          from pathlib import Path
          dataset = Path(".harbor/smoke").resolve()
          Path(".harbor/repeated-job.json").write_text(json.dumps({
              "datasets": [{"path": str(dataset)}],
              "agents": [{"name": "scripts.harbor.smoke_agent:EmptyReviewAgent"}],
              "metrics": [{"type": "uv-script", "kwargs": {"script_path": str(dataset / "metric.py")}}],
          }), encoding="utf-8")
          PY
          harbor run \
            -c .harbor/repeated-job.json -p .harbor/smoke -a scripts.harbor.smoke_agent:EmptyReviewAgent \
            -e docker -l 1 -k 2 -n 2 --plugin reviewbench_harbor.reviewbench_plugin:ReviewBenchPlugin \
            --job-name repeated-smoke --jobs-dir .harbor/jobs --yes
          reviewbench-check-job .harbor/jobs/repeated-smoke \
            .harbor/smoke/metric.py --output .harbor/repeated-metrics.json
          python - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path(".harbor/repeated-metrics.json").read_text())
          assert result["complete"] == 1
          assert result["expected_prs"] == 1
          assert result["n_attempts"] == 2
          assert result["scored_trials"] == result["expected_trials"] == 2
          assert result["completed_rounds"] == 2
          assert result["summary.micro.overall.grounded_recall.mean"] == 0
          assert result["summary.micro.overall.grounded_recall.stddev"] == 0
          PY
      - name: Archive smoke evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: harbor-docker-smoke
          path: |
            .harbor/jobs/
            .harbor/smoke-metrics.json
            .harbor/repeated-metrics.json
          if-no-files-found: warn
