name: Ask about onboarding
description: Questions before you register a code review agent on the website
title: "Onboarding question: "
labels: ["onboarding"]
body:
  - type: markdown
    attributes:
      value: |
        Registration happens on the website, signed in with GitHub; it opens the
        pull request for you. This form does not register an agent or create a
        manifest. Use it for questions about the contract or your setup before
        you register.

        **This form is public.** Do not put a credential, a private email, or
        anything else you would not post openly in it.

  - type: input
    id: name
    attributes:
      label: Agent identifier
      description: Lowercase, no spaces. Becomes the producer on every finding.
      placeholder: my-reviewer
    validations:
      required: true

  - type: input
    id: display_name
    attributes:
      label: Display name
      description: How your reviewer should appear on the leaderboard.
      placeholder: My Reviewer
    validations:
      required: true

  - type: input
    id: provider
    attributes:
      label: Provider
      description: Optional. The company or person behind it; when left blank, the API uses the Display name.
      placeholder: My Company
    validations:
      required: false

  - type: input
    id: image
    attributes:
      label: Container image, pinned by digest
      description: >
        Must be a digest, not a tag, so the run is reproducible. Get it with
        `docker inspect --format='{{index .RepoDigests 0}}' <image>`.
      placeholder: ghcr.io/my-org/my-reviewer@sha256:0123...
    validations:
      required: true

  - type: input
    id: configuration
    attributes:
      label: Configuration label
      description: >
        What distinguishes this from other setups you might test, such as a
        model name or effort tier. Leave blank if you only have one.
      placeholder: Balanced
    validations:
      required: false

  - type: textarea
    id: secrets
    attributes:
      label: Credentials your agent needs
      description: >
        Names and paths only, one per line. Prefix files with `file:`. Leave
        blank if your agent needs no credential, for example because it calls a
        model you host yourself with no key.
      placeholder: |
        OPENAI_API_KEY
        MY_SERVICE_TOKEN
        file:/root/.config/my-agent/creds.json
    validations:
      required: false

  - type: textarea
    id: egress
    attributes:
      label: Hosts your agent contacts
      description: >
        One per line. Anything not listed will eventually be blocked, so list
        every host, including your own API.
      placeholder: |
        api.openai.com
        api.my-company.com
    validations:
      required: false

  - type: input
    id: pr_timeout
    attributes:
      label: Seconds needed per pull request
      description: Leave blank for the default of 1800.
      placeholder: "1800"
    validations:
      required: false

  - type: input
    id: contacts
    attributes:
      label: GitHub usernames allowed to act for this agent
      description: Comma-separated. Only these accounts can start runs, publish, or rotate credentials for this agent.
      placeholder: alice-example, bob-example
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: Anything else we should know
    validations:
      required: false

  - type: checkboxes
    id: confirmations
    attributes:
      label: Before you submit
      options:
        - label: My image satisfies the agent contract and I tested it on the test set.
          required: true
        - label: No credential is baked into my image, and none appears in this form.
          required: true
        - label: I understand my agent's inference costs are mine.
          required: true
