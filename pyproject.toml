[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "reviewbench-harbor"
version = "0.1.0rc6"
description = "ReviewBench public benchmark runtime for Harbor"
requires-python = ">=3.12"
license = "MIT"
dependencies = ["harbor==0.24.0"]

[project.scripts]
reviewbench-check-job = "reviewbench_harbor:check_job_main"
reviewbench-check-dataset = "reviewbench_harbor:check_dataset_main"

[tool.setuptools]
packages = ["reviewbench_harbor"]
include-package-data = false

[tool.setuptools.package-dir]
reviewbench_harbor = "scripts/harbor"

[tool.setuptools.package-data]
reviewbench_harbor = ["check-job.py"]
